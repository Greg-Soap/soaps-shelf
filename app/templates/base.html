<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Shelf{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#1a120d" />
  <link rel="stylesheet" href="/static/style.css?v=8" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="dust" aria-hidden="true"></div>
  {% block body %}
  <header class="site-header">
    <a class="brand" href="/">Shelf</a>
    <p class="tagline">Librarian + EPUB compiler for Prestigio — not a reader.</p>
    <nav class="site-nav" aria-label="Primary">
      <a href="/">Shelf</a>
      <a href="/compiler">Compiler</a>
      <a href="/categories">Categories</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
  <script src="/static/shelf.js?v=8" defer></script>
</body>
</html>
